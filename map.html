<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suivi du bateau</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    h2 {
      margin: 10px;
    }

    #map {
      height: 90vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>Suivi du bateau en temps réel</h2>
  <div id="map"></div>

 <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([51.018471, 2.355795], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const marker = L.marker([51.018471, 2.355795])
    .addTo(map)
    .bindPopup("Position du bateau")
    .openPopup();

  const protocol =
    window.location.protocol === "https:" ? "wss" : "ws";

  const socket = new WebSocket(
    `${protocol}://${window.location.host}`
  );

  socket.onopen = () => {
    console.log("WebSocket connecté");
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);

    console.log("Nouvelle position :", data);

    marker.setLatLng([
      data.latitude,
      data.longitude
    ]);

    map.setView([
      data.latitude,
      data.longitude
    ], 15);

    marker.bindPopup(
      `Latitude : ${data.latitude}<br>Longitude : ${data.longitude}`
    );
  };

  socket.onerror = (err) => {
    console.error("Erreur WebSocket :", err);
  };
</script>
</body>
</html>
